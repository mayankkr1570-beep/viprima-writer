name: M1b - Native Writer editing API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uno-feasibility.yml'
      - 'tests/engine/uno_edit_probe.py'
permissions:
  contents: read
jobs:
  uno:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install evaluated engine version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install libreoffice-fresh --version=26.8.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Engine installation failed' }
      - name: Exercise native document editing API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $program = Join-Path $env:ProgramFiles 'LibreOffice\program'
          $python = Join-Path $program 'python.exe'
          $engine = Join-Path $program 'soffice.exe'
          if (!(Test-Path $python)) { throw 'Bundled UNO Python unavailable; investigate SDK route' }
          & $python tests/engine/uno_edit_probe.py $engine
          if ($LASTEXITCODE -ne 0) { throw 'UNO editing probe failed' }
          '### M1b native document editing smoke test passed' >> $env:GITHUB_STEP_SUMMARY
          'Not an interactive editor, visual compatibility test or product release.' >> $env:GITHUB_STEP_SUMMARY
