name: M2 - Native source compilation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-compile.yml'
concurrency:
  group: native-compile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Cygwin build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'setup-x86_64.exe'
          Invoke-WebRequest https://cygwin.com/setup-x86_64.exe -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid') { throw 'Cygwin installer signature not valid' }
          $p = Start-Process $setup -ArgumentList '-q -B -R D:\cygwin -s https://mirrors.kernel.org/sourceware/cygwin/ -l D:\cygcache -P autoconf,automake,make,git,perl,python3,pkg-config,gperf,patch,diffutils,findutils,grep,sed,gawk,zip,unzip,bison,flex,curl,wget,rsync,tar,xz,which,libxml2-devel,libxslt-devel' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path D:\cygwin\bin\bash.exe)) { throw 'Cygwin setup failed' }
          & D:\cygwin\bin\bash.exe -lc 'gperf --version'
          if ($LASTEXITCODE -ne 0) { throw 'gperf prerequisite check failed' }
      - name: Provision verified native Windows pkgconf
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force D:\lo-tools | Out-Null
          $pkg = 'D:\lo-tools\pkgconf-2.4.3.exe'
          Invoke-WebRequest 'https://dev-www.libreoffice.org/extern/pkgconf-2.4.3.exe' -OutFile $pkg
          if ((Get-FileHash $pkg -Algorithm SHA256).Hash -ne '791cd6dbc56f7268fbf9c4652d6634b0f5c59687ab4e504565e58245952edd41') { throw 'pkgconf SHA256 mismatch' }
          & $pkg --version
          if ($LASTEXITCODE -ne 0) { throw 'Native pkgconf failed' }
      - name: Provision native NASM and validate toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm --version=2.16.3 --yes --no-progress --require-checksums
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          $candidates = @("$env:ProgramFiles\NASM\nasm.exe","${env:ProgramFiles(x86)}\NASM\nasm.exe","$env:LOCALAPPDATA\bin\NASM\nasm.exe","$env:ChocolateyInstall\bin\nasm.exe")
          $nasm = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (!$nasm) { throw 'Native NASM executable not found after installation' }
          $dir = Split-Path $nasm
          $dir >> $env:GITHUB_PATH
          $env:PATH = "$dir;$env:PATH"
          & $nasm -v
          if ($LASTEXITCODE -ne 0) { throw 'Native NASM version check failed' }
          & D:\cygwin\bin\bash.exe -lc 'set -e; for tool in autoconf automake make git perl python3 gperf bison flex patch wget zip unzip tar shasum nasm; do command -v "$tool" || exit 1; done; nasm -v; cmd.exe /d /c "where nasm && nasm -v"'
          if ($LASTEXITCODE -ne 0) { throw 'Build tool visibility check failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'VS2022 C++ tools missing' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = 'call "' + $dev + '" -arch=x64 -host_arch=x64 && where cl && where nmake && where nasm && nasm -v'
          & cmd.exe /d /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'MSVC/NASM tool visibility check failed' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free
          'Native toolchain and installer compiler preflight passed.' >> $env:GITHUB_STEP_SUMMARY
      - name: Fetch pinned source and apply native UI changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git init D:\lo
          if ($LASTEXITCODE -ne 0) { throw 'git init failed' }
          git -C D:\lo config core.autocrlf false
          git -C D:\lo config core.longpaths true
          git -C D:\lo remote add origin https://github.com/LibreOffice/core.git
          git -C D:\lo fetch --depth=1 origin 861effc5289d539f15c4c18d1ba8579ffd78728b
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed' }
          git -C D:\lo checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
          python engine/customize_ribbon.py D:\lo
          if ($LASTEXITCODE -ne 0) { throw 'UI patch failed' }
      - name: Configure and compile native Windows engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:\cygwin\bin\bash.exe -lc 'set -e; cd /cygdrive/d/lo; PKG_CONFIG=/cygdrive/d/lo-tools/pkgconf-2.4.3.exe ./autogen.sh --host=x86_64-pc-cygwin --with-visual-studio=2022 --disable-ccache --without-java --without-junit --without-doxygen --disable-online-update --enable-python=fully-internal; make -j4'
          if ($LASTEXITCODE -ne 0) { throw 'Native source build failed; inspect configure/build log' }
          if (!(Test-Path D:\lo\instdir\program\soffice.exe)) { throw 'Native executable missing' }
          Get-FileHash D:\lo\instdir\program\soffice.exe -Algorithm SHA256
          'Native compilation passed; not a production release.' >> $env:GITHUB_STEP_SUMMARY
      - name: Stage compiled runtime and build launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force stage\runtime | Out-Null
          Copy-Item D:\lo\instdir\* stage\runtime -Recurse -Force
          if (!(Test-Path stage\runtime\program\soffice.com)) { throw 'Runtime incomplete' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'VS2022 missing' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = 'call "' + $dev + '" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /W4 /O2 /MT src\windows\launcher.cpp /Fe:stage\ViPrimaWriter.exe /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib'
          & cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Launcher failed' }
          Copy-Item D:\lo\COPYING stage\runtime\UPSTREAM-COPYING.txt
          @('ViPrima Writer development preview 0.1.0','Experimental; not for confidential or production documents.','Derived from LibreOffice core 861effc5289d539f15c4c18d1ba8579ffd78728b.','Upstream source: https://github.com/LibreOffice/core/tree/861effc5289d539f15c4c18d1ba8579ffd78728b','Modification source: https://github.com/mayankkr1570-beep/viprima-writer','Preserve all upstream license and attribution files. Redistribution review remains pending.','Unsigned; offline isolation and GUI acceptance not yet verified.') | Set-Content stage\NOTICE.txt
      - name: Test staged runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $program = (Resolve-Path stage\runtime\program).Path
          & "$program\soffice.com" --version
          if ($LASTEXITCODE -ne 0) { throw 'Runtime version failed' }
          & "$program\python.exe" tests/engine/uno_edit_probe.py "$program\soffice.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Staged runtime editing failed' }
      - name: Build development setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          & $iscc installer/viprima-dev.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = (Resolve-Path dist\ViPrima_Writer_v0.1.0_Development_Setup_x64.exe).Path
          Get-FileHash $setup -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist\SHA256SUMS.txt
      - name: Test silent install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path dist\ViPrima_Writer_v0.1.0_Development_Setup_x64.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'ViPrimaInstallTest'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path "$target\ViPrimaWriter.exe")) { throw 'Install test failed' }
          & "$target\runtime\program\soffice.com" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime failed' }
          $uninstall = Get-ChildItem $target -Filter 'unins*.exe' | Select-Object -First 1
          if (!$uninstall) { throw 'Uninstaller missing' }
          $p = Start-Process $uninstall.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$target\ViPrimaWriter.exe")) { throw 'Uninstall test failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ViPrima-Writer-0.1.0-internal-dev
          path: dist/
          if-no-files-found: error
          retention-days: 7
